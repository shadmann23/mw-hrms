upstream hrms_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS (uncomment when SSL cert is installed)
    # return 301 https://$host$request_uri;

    # OR serve directly on HTTP for testing:
    include /etc/nginx/conf.d/hrms_common.conf;
}

# Uncomment when you have SSL certificates:
# server {
